name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      create_tag:
        description: 'Create a release tag (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Update version if tag specified
        if: github.event.inputs.create_tag != ''
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG="${{ github.event.inputs.create_tag }}"
          VERSION="${TAG#v}"
          
          echo "Updating version to: $VERSION"
          
          # Update package.json
          npm version $VERSION --no-git-tag-version
          
          # Update wxt.config.ts if it exists and has a version field
          if [ -f wxt.config.ts ]; then
            sed -i "s/version: '[^']*'/version: '$VERSION'/g" wxt.config.ts
            sed -i 's/version: "[^"]*"/version: "'$VERSION'"/g' wxt.config.ts
            echo "Updated wxt.config.ts"
          fi
          
          # Commit the changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json wxt.config.ts 2>/dev/null || true
          git commit -m "chore: bump version to $VERSION" || true
          git push

  build-chrome:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install

      - name: Build chrome extension
        run: yarn build

      - name: Zip chrome extension
        run: yarn zip

      - name: Verify and stage chrome zip
        run: |
          mkdir -p dist
          
          # Read version from package.json
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Extension version: $VERSION"
          
          # Find the chrome zip file (WXT names it: leet-zen-VERSION-chrome.zip)
          CHROME_ZIP=$(find ./.output -maxdepth 1 -name "leet-zen-$VERSION-chrome.zip" 2>/dev/null | head -1)
          
          if [ -z "$CHROME_ZIP" ]; then
            echo "✗ Error: Chrome zip not found for version $VERSION!"
            echo "Available zips in .output:"
            find ./.output -name '*.zip' -type f 2>/dev/null || echo "No .output directory"
            exit 1
          fi
          
          cp "$CHROME_ZIP" dist/leet-zen-chrome.zip
          echo "✓ Chrome zip created successfully"
          echo "File: $(basename $CHROME_ZIP)"
          unzip -l dist/leet-zen-chrome.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-zip
          path: dist/

  build-firefox:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install

      - name: Build firefox extension
        run: yarn build:firefox

      - name: Zip firefox extension
        run: yarn zip:firefox

      - name: Verify and stage firefox zip
        run: |
          mkdir -p dist
          
          # Read version from package.json
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Extension version: $VERSION"
          
          # Find the firefox zip file (WXT names it: leet-zen-VERSION-firefox.zip)
          FIREFOX_ZIP=$(find ./.output -maxdepth 1 -name "leet-zen-$VERSION-firefox.zip" 2>/dev/null | head -1)
          
          if [ -z "$FIREFOX_ZIP" ]; then
            echo "✗ Error: Firefox zip not found for version $VERSION!"
            echo "Available zips in .output:"
            find ./.output -name '*.zip' -type f 2>/dev/null || echo "No .output directory"
            exit 1
          fi
          
          cp "$FIREFOX_ZIP" dist/leet-zen-firefox.zip
          echo "✓ Firefox zip created successfully"
          echo "File: $(basename $FIREFOX_ZIP)"
          unzip -l dist/leet-zen-firefox.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-zip
          path: dist/

  release:
    needs: [build-chrome, build-firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Create tag if specified
        if: github.event.inputs.create_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.create_tag }}
          git push origin ${{ github.event.inputs.create_tag }}

      - uses: actions/download-artifact@v4
        with:
          name: chrome-zip
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: firefox-zip
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true